<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fazha | Orders</title>
<style>
:root{--bg:#f6fbff;--card:#fff;--ink:#12324a;--mute:#51697d;--a:#0f7f5c;--line:#d9e9f5;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0a1822;--card:#11283a;--ink:#eaf6ff;--mute:#9fb9cc;--line:#24435a;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:5vw;max-width:760px;margin:auto}
h1{font-size:1.6rem}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 18px;color:var(--mute)}
input,button{font:inherit;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
button{background:var(--a);color:#fff;border:0;font-weight:700;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card p{white-space:pre-wrap;margin:8px 0}
.b{display:inline-block;padding:2px 12px;border-radius:999px;font-size:.85rem;font-weight:700;margin-right:6px}
.ok{background:#c9f1df;color:#0b5a41}.no{background:#fff0c9;color:#7a5200}
small{color:var(--mute)}
.er{color:#d6453d;font-weight:600;margin:-6px 0 14px}
.rc{display:block;width:90px;margin-top:8px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}.rc.big{width:100%;max-width:420px;cursor:zoom-out}
</style></head><body>
<h1>Orders</h1>
<form id="lg" class="bar"><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" required><button>Open</button></form>
<p id="e" class="er" role="alert" hidden></p>
<div id="bar" class="bar" hidden><b id="n"></b><button id="rf" type="button">Refresh</button><small id="msg"></small></div>
<div id="list"></div>
<script src="config.js"></script>
<script>
const API=(window.FAZHA_API||"").replace(/\/+$/,""),$=s=>document.querySelector(s),PM={shopee:"ShopeePay",tng:"Touch ’n Go",paypal:"PayPal"};
const h=(t,c,...k)=>{const e=document.createElement(t);if(c)e.className=c;k.flat().forEach(x=>e.append(x));return e};
const fd=t=>new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
let pw=sessionStorage.getItem("fz_admin")||"",rev=0;
const fail=m=>{if($("#bar").hidden){$("#e").textContent=m;$("#e").hidden=false;$("#lg").hidden=false;pw="";rev=0;sessionStorage.removeItem("fz_admin")}else $("#msg").textContent=m};
async function load(){
  try{
    const r=await fetch(API+"/api/orders?rev="+rev,{headers:{"x-admin":pw,"ngrok-skip-browser-warning":"1"}});
    if(r.status==401){sessionStorage.removeItem("fz_admin");if(pw)alert("Wrong password");pw="";rev=0;$("#lg").hidden=false;$("#bar").hidden=true;$("#list").replaceChildren();return}
    if(r.status==429)return fail("Too many wrong tries. Please wait 10 minutes, then try again.");
    if(!r.ok)return fail("The order server did not answer (error "+r.status+"). Check the address in config.js.");
    let d;try{d=await r.json()}catch(_){return fail("This address is not running the order server. Check the address in config.js.")}
    if(!d||(!d.same&&!Array.isArray(d.orders)))return fail("The order server sent an unexpected answer. Check the address in config.js.");
    $("#e").hidden=true;$("#lg").hidden=true;$("#bar").hidden=false;$("#msg").textContent="Updated "+new Date().toLocaleTimeString();if(d.same)return;rev=d.rev;const a=d.orders;
    $("#lg").hidden=true;$("#bar").hidden=false;
    $("#n").textContent=a.length+" order"+(a.length==1?"":"s");
    $("#msg").textContent="Updated "+new Date().toLocaleTimeString();
    $("#list").replaceChildren(...a.map(({order:o,events})=>{
      const m=h("a");m.href="mailto:"+o.email;m.textContent=o.email;
      const c=h("div","card",h("b","","#"+o.id+" · "+o.pkg+" · RM "+o.price),h("br"),o.name+" · ",m,h("p","",o.desc),
        h("span","b "+(o.paid?"ok":"no"),o.paid?"Payment sent"+(o.pm?" via "+(PM[o.pm]||o.pm):""):"Awaiting payment"),
        o.ntr?h("span","b no","NTR mode"):"",h("br"),
        h("small","","Placed "+fd(o.ts)+" · "+events.map(e=>e.kind+" "+fd(e.at)).join(" · ")));
      if(o.rcpt){const i=h("img","rc");i.src=o.rcpt;i.alt="Payment receipt";i.onclick=()=>i.classList.toggle("big");c.append(i)}
      (o.ref||[]).forEach(r=>{const i=h("img","rc");i.src=r;i.alt="Reference picture";i.onclick=()=>i.classList.toggle("big");c.append(i)});
      return c}));
  }catch(_){fail("Can't reach the server")}
}
$("#lg").onsubmit=e=>{e.preventDefault();pw=$("#pw").value;rev=0;sessionStorage.setItem("fz_admin",pw);load()};
$("#rf").onclick=load;
if(pw)load();
setInterval(()=>{if(pw&&!$("#bar").hidden&&!document.hidden)load()},60000);
</script></body></html>
