name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Collect the public website files (leaves out server code, notes and private folders)
        run: |
          mkdir _site
          tar --exclude=./_site --exclude=./.git --exclude=./.github --exclude=./server.js --exclude=./worker.js --exclude=./worker --exclude=./data --exclude='*.md' -cf - . | tar -xf - -C _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
